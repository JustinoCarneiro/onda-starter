# Hooks locais do OndaDev. Instale uma vez:
#   pipx install pre-commit  (ou: pip install --user pre-commit)
#   pre-commit install
# Rodar em tudo: pre-commit run --all-files
#
# O CI roda os mesmos hooks. Nenhum segredo é necessário.

minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ondadev-skills-sync
        name: skills OndaDev sincronizadas com a fonte canônica
        entry: bash setup/shared/sync-skills.sh --check
        language: system
        files: ^(setup/shared/skills/|\.claude/skills/|\.agents/skills/|setup/shared/skills-manifest\.sha256)
        pass_filenames: false
      - id: ondadev-no-dated-models
        name: sem IDs de modelo datados
        entry: bash setup/tests/skills-drift.sh
        language: system
        pass_filenames: false
      - id: ondadev-context-contract
        name: contrato de contexto (AGENTS.md + CLAUDE.md)
        entry: bash scripts/validate-agent-context.sh
        language: system
        files: ^(AGENTS\.md|CLAUDE\.md|docs/)
        pass_filenames: false
