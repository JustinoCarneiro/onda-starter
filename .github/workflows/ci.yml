name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Permissão mínima: os jobs só leem o repositório. Nenhum job escreve.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validações determinísticas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Relatório de CI
        run: bash scripts/ci-report.sh

  installer-smoke:
    name: Smoke do instalador (Ubuntu limpo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Smoke test
        run: bash setup/tests/install-smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versão fixada)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Varredura do histórico completo
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all"
