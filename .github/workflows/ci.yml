name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Permissão mínima: os jobs só leem o repositório. Nenhum job escreve.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validações determinísticas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Relatório de CI
        run: bash scripts/ci-report.sh

  installer-smoke:
    name: Smoke do instalador (Ubuntu limpo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Smoke test
        run: bash setup/tests/install-smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Instalar pre-commit
        run: pipx install pre-commit
      - name: gitleaks + detect-private-key
        run: pre-commit run --all-files --show-diff-on-failure gitleaks detect-private-key
